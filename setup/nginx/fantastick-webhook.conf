# Reverse proxy for Fantastick's HTTP Interactions Endpoint (INTERACTIONS_MODE=webhook, the
# default). Install at /etc/nginx/sites-available/<server_name>.conf and symlink it into
# sites-enabled. Modeled on HammerTimeBot's bot.hammertime.cyou vhost.
#
# Replace server_name and the TLS include with whatever certificate setup the host uses, and
# keep the proxy_pass port in sync with WEBHOOK_PORT in .env. In the Discord developer portal,
# set the Interactions Endpoint URL to https://<server_name>/<WEBHOOK_PATH_SECRET>.

# Timing-oriented log, for telling apart where a slow interaction delivery spent its time:
# rt = total, urt = the Node process's share, reqs > 1 = Cloudflare reused a connection,
# cf_ray's suffix = the Cloudflare data center that received the request from Discord.
log_format fantastick_webhook '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
    'conn=$connection reqs=$connection_requests cf_ray=$http_cf_ray "$http_user_agent"';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fantastick.example.com;

    access_log /var/log/nginx/fantastick-webhook-access.log fantastick_webhook;
    error_log /var/log/nginx/fantastick-webhook-error.log;

    include snippets/cf-resolve-ips.conf;
    include snippets/ssl-wenttf-cfcert.conf;
    include snippets/ssl-params.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    # The app only answers POST /<WEBHOOK_PATH_SECRET> and 404s everything else itself.
    location / {
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry only when the backend is unreachable (e.g. the gap during `pm2 restart`), never
        # on an HTTP 5xx from the app, which could replay an interaction that was already
        # partly handled. Kept fast enough to still meet Discord's 3-second response deadline.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 2s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name fantastick.example.com;
    return 301 https://$host$request_uri;
}
